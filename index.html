<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1565c0">
<title>Utfodringar</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, system-ui, Arial, sans-serif;
    background: #f0f2f5;
    padding: 0 12px calc(90px + env(safe-area-inset-bottom));
  }
  .logo { text-align: center; padding: calc(16px + env(safe-area-inset-top)) 0 12px; }
  .logo img { width: 120px; max-width: 38vw; height: auto; border-radius: 50%; display: inline-block; box-shadow: 0 2px 8px rgba(0,0,0,.2); }
  header {
    position: sticky; top: 0; z-index: 10;
    background: #1565c0; color: #fff;
    margin: 0 -12px 12px; padding: 14px 16px;
    text-align: center;
  }
  h1 { margin: 0; font-size: 22px; }
  h2 { font-size: 18px; margin: 28px 0 10px; padding-top: 16px; border-top: 2px solid #cfd4da; }
  #list, #history { display: flex; flex-direction: column; gap: 12px; }
  .card {
    background: #fff; border-radius: 14px; padding: 14px;
    box-shadow: 0 1px 4px rgba(0,0,0,.15);
    display: flex; flex-direction: column; gap: 12px;
  }
  label { display: block; font-size: 13px; color: #555; margin-bottom: 4px; }
  input[type="date"], input[type="text"] {
    width: 100%; min-height: 48px; padding: 10px 12px;
    font-size: 16px; border: 1px solid #ccc; border-radius: 10px; background: #fff;
    -webkit-appearance: none; appearance: none;
  }
  .count { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .count button {
    flex: 0 0 72px; height: 64px; font-size: 34px; line-height: 1;
    border: none; border-radius: 14px; color: #fff; background: #2e7d32; cursor: pointer;
    touch-action: manipulation;
  }
  .count button.minus { background: #c62828; }
  .count button:active { opacity: .7; }
  .count span { flex: 1; text-align: center; font-size: 36px; font-weight: bold; }
  .actions { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .del {
    min-height: 44px; padding: 0 8px;
    background: none; border: none; color: #888; font-size: 15px; cursor: pointer;
  }
  .savebtn {
    min-height: 44px; padding: 0 16px; font-size: 16px; font-weight: bold;
    border: none; border-radius: 10px; background: #e3f2fd; color: #1565c0; cursor: pointer;
  }
  .add {
    position: fixed; left: 12px; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom));
    height: 58px; font-size: 19px; font-weight: bold;
    border: none; border-radius: 14px; background: #1565c0; color: #fff;
    box-shadow: 0 2px 8px rgba(0,0,0,.3); cursor: pointer; touch-action: manipulation;
  }
  .add:active { opacity: .8; }
  .hrow {
    background: #fff; border-radius: 12px; padding: 12px 14px;
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    box-shadow: 0 1px 3px rgba(0,0,0,.12);
  }
  .hinfo { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .hname { font-size: 17px; font-weight: bold; overflow-wrap: anywhere; }
  .hdate { font-size: 13px; color: #666; }
  .hcount { font-size: 24px; font-weight: bold; color: #2e7d32; }
  .hdel { background: none; border: none; color: #999; font-size: 22px; padding: 8px; cursor: pointer; }
  .total {
    margin-top: 12px; padding: 12px 16px; border-radius: 12px;
    background: #1565c0; color: #fff; font-weight: bold; font-size: 16px;
    align-items: center; justify-content: space-between;
  }
  .total .num { font-size: 30px; }
  .empty { text-align: center; color: #888; padding: 12px; }
  .clear { display: block; margin: 12px auto 0; background: none; border: none; color: #c62828; font-size: 15px; padding: 10px; cursor: pointer; }
</style>
</head>

<header><h1>Utfodringar</h1></header>
<div id="list"></div>

<h2>Historik</h2>
<div id="history"></div>
<div class="total" id="total" style="display:none"><span>Totalt antal</span><span class="num" id="totalNum">0</span></div>
<button class="clear" id="clearBtn" onclick="clearHistory()" style="display:none">Rensa historik</button>

<button class="add" onclick="addCard()">+ Ny utfodring</button>

<script>
const KEY = 'utfodringar';
const HKEY = 'utfodringar_historik';
let history = [];

function todayStr() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

function addCard(data) {
  if (!data) {
    const first = document.querySelector('.f-date');
    data = { date: (first && first.value) ? first.value : todayStr(), name: '', count: 0 };
  }
  const d = document.createElement('div');
  d.className = 'card';
  d.innerHTML = `
    <div><label>Datum</label><input type="date" class="f-date"></div>
    <div><label>Namn</label><input type="text" class="f-name" placeholder="Namn" autocomplete="off"></div>
    <div><label>Antal</label>
      <div class="count">
        <button class="minus" onclick="change(this,-1)">−</button>
        <span class="f-count">0</span>
        <button onclick="change(this,1)">+</button>
      </div>
    </div>
    <div class="actions">
      <button class="del" onclick="removeCard(this)">Ta bort</button>
      <button class="savebtn" onclick="toHistory(this)">Spara i historik</button>
    </div>`;
  const dateEl = d.querySelector('.f-date');
  dateEl.max = todayStr();
  dateEl.value = (data.date && data.date <= todayStr()) ? data.date : todayStr();
  d.querySelector('.f-name').value = data.name;
  d.querySelector('.f-count').textContent = data.count;
  d.addEventListener('input', save);
  document.getElementById('list').appendChild(d);
  save();
}

function change(btn, delta) {
  const span = btn.parentElement.querySelector('.f-count');
  span.textContent = Math.max(0, parseInt(span.textContent) + delta);
  save();
}

function removeCard(btn) {
  btn.closest('.card').remove();
  save();
}

function toHistory(btn) {
  const c = btn.closest('.card');
  const count = parseInt(c.querySelector('.f-count').textContent);
  if (count === 0 && !confirm('Antal är 0. Spara ändå?')) return;
  history.unshift({
    date: c.querySelector('.f-date').value,
    name: c.querySelector('.f-name').value || '(inget namn)',
    count: count
  });
  c.querySelector('.f-count').textContent = 0;
  save();
  renderHistory();
}

function deleteHistory(i) {
  history.splice(i, 1);
  save();
  renderHistory();
}

function clearHistory() {
  if (!confirm('Rensa hela historiken?')) return;
  history = [];
  save();
  renderHistory();
}

function renderHistory() {
  const box = document.getElementById('history');
  box.innerHTML = '';
  document.getElementById('clearBtn').style.display = history.length ? 'block' : 'none';
  const sum = history.reduce((a, x) => a + (parseInt(x.count) || 0), 0);
  document.getElementById('total').style.display = history.length ? 'flex' : 'none';
  document.getElementById('totalNum').textContent = sum;
  if (!history.length) {
    box.innerHTML = '<div class="empty">Ingen historik än</div>';
    return;
  }
  history.forEach((h, i) => {
    const r = document.createElement('div');
    r.className = 'hrow';
    const info = document.createElement('div');
    info.className = 'hinfo';
    const n = document.createElement('div');
    n.className = 'hname';
    n.textContent = h.name;
    const dt = document.createElement('div');
    dt.className = 'hdate';
    dt.textContent = h.date;
    info.append(n, dt);
    const cnt = document.createElement('div');
    cnt.className = 'hcount';
    cnt.textContent = h.count;
    const x = document.createElement('button');
    x.className = 'hdel';
    x.textContent = '✕';
    x.setAttribute('aria-label', 'Ta bort');
    x.onclick = () => deleteHistory(i);
    r.append(info, cnt, x);
    box.appendChild(r);
  });
}

function save() {
  try {
    const items = [...document.querySelectorAll('.card')].map(c => ({
      date: c.querySelector('.f-date').value,
      name: c.querySelector('.f-name').value,
      count: parseInt(c.querySelector('.f-count').textContent)
    }));
    localStorage.setItem(KEY, JSON.stringify(items));
    localStorage.setItem(HKEY, JSON.stringify(history));
  } catch (e) {}
}

function clampDate(e) {
  const el = e.target;
  if (!el.classList || !el.classList.contains('f-date')) return;
  const t = todayStr();
  el.max = t;
  if (el.value > t) { el.value = t; save(); }
}
function syncDates(e) {
  const first = document.querySelector('.f-date');
  if (!first || e.target !== first || !first.value) return;
  document.querySelectorAll('.f-date').forEach(el => { el.value = first.value; });
  save();
}
document.getElementById('list').addEventListener('input', clampDate);
document.getElementById('list').addEventListener('change', clampDate);
document.getElementById('list').addEventListener('focusin', clampDate);
document.getElementById('list').addEventListener('input', syncDates);
document.getElementById('list').addEventListener('change', syncDates);

(function init() {
  let items = [];
  try { items = JSON.parse(localStorage.getItem(KEY)) || []; } catch (e) {}
  try { history = JSON.parse(localStorage.getItem(HKEY)) || []; } catch (e) {}
  if (items.length) items.forEach(addCard); else addCard();
  renderHistory();
})();
</script>
</body>
</html>
