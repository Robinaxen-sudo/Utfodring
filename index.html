<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ringstad Stallarna</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

body{
background:linear-gradient(135deg,#0f172a,#1e293b);
min-height:100vh;
color:white;
padding:15px;
padding-bottom:100px;
}

header{
text-align:center;
margin-bottom:20px;
}

header h1{
font-size:32px;
font-weight:800;
}

header p{
opacity:.7;
margin-top:5px;
}

.stats{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:10px;
margin-bottom:20px;
}

.stat{
background:rgba(255,255,255,.08);
backdrop-filter:blur(15px);
border:1px solid rgba(255,255,255,.1);
border-radius:18px;
padding:15px;
text-align:center;
}

.stat span{
font-size:12px;
opacity:.7;
display:block;
}

.stat strong{
font-size:28px;
display:block;
margin-top:5px;
}

.actions-top{
display:flex;
gap:10px;
margin-bottom:20px;
}

.actions-top button{
flex:1;
border:none;
border-radius:14px;
padding:14px;
font-size:15px;
font-weight:700;
cursor:pointer;
background:#2563eb;
color:white;
}

#list{
display:flex;
flex-direction:column;
gap:15px;
}

.card{
background:rgba(255,255,255,.08);
backdrop-filter:blur(15px);
border:1px solid rgba(255,255,255,.1);
border-radius:20px;
padding:15px;
}

label{
display:block;
margin-bottom:5px;
font-size:13px;
opacity:.8;
}

input{
width:100%;
padding:12px;
border:none;
border-radius:12px;
background:rgba(255,255,255,.1);
color:white;
margin-bottom:12px;
font-size:16px;
}

.count{
display:flex;
align-items:center;
justify-content:space-between;
margin-top:6px;
}

.count button{

width:65px;
height:65px;
border:none;
border-radius:50%;
font-size:30px;
font-weight:bold;
cursor:pointer;
color:white;

}

.minus{
background:#dc2626;
}

.plus{
background:#16a34a;
}

.f-count{
font-size:42px;
font-weight:800;
}

.card-actions{
display:flex;
justify-content:space-between;
margin-top:15px;
gap:10px;
}

.card-actions button{

flex:1;
padding:12px;
border:none;
border-radius:12px;
cursor:pointer;
font-weight:700;

}

.savebtn{
background:#2563eb;
color:white;
}

.removebtn{
background:#374151;
color:white;
}

h2{
margin-top:25px;
margin-bottom:15px;
}

.hrow{
display:flex;
justify-content:space-between;
align-items:center;
background:rgba(255,255,255,.08);
padding:14px;
border-radius:14px;
margin-bottom:10px;
border-left:5px solid #3b82f6;
}

.hname{
font-weight:700;
}

.hdate{
font-size:13px;
opacity:.7;
}

.hcount{
font-size:24px;
font-weight:bold;
color:#4ade80;
}

.hdel{
background:none;
border:none;
color:#ff4b4b;
font-size:20px;
cursor:pointer;
}

.add{
position:fixed;
bottom:20px;
left:15px;
right:15px;
height:60px;
border:none;
border-radius:20px;
background:linear-gradient(135deg,#2563eb,#1d4ed8);
font-size:18px;
font-weight:800;
color:white;
cursor:pointer;
box-shadow:0 10px 30px rgba(37,99,235,.35);
}

.empty{
opacity:.5;
text-align:center;
padding:20px;
}

</style>
</head>

<body>

<header>
<h1>🐴 Ringstad Stallarna</h1>
<p>Utfodringshantering</p>
</header>

<div class="stats">

<div class="stat">
<span>Hagar</span>
<strong id="hageCount">0</strong>
</div>

<div class="stat">
<span>Totalt</span>
<strong id="totalCount">0</strong>
</div>

<div class="stat">
<span>Historik</span>
<strong id="historyCount">0</strong>
</div>

</div>

<div class="actions-top">

<button onclick="exportBackup()">
📥 Backup
</button>

<button onclick="importBackup()">
📤 Återställ
</button>

</div>

<input type="file" id="restoreFile" hidden>

<div id="list"></div>

<h2>Historik</h2>

<div id="history"></div>

<button class="add" onclick="addCard()">
+ Lägg till hage
</button>

<script>

const KEY="stall_hagar";
const HKEY="stall_historik";

let history=[];

function today(){
return new Date().toISOString().split("T")[0];
}

function addCard(data={}){

const card=document.createElement("div");

card.className="card";

card.innerHTML=`

<label>Datum</label>
<input type="date" class="f-date" value="${data.date||today()}">

<label>Hage</label>
<input type="text" class="f-name" value="${data.name||""}" placeholder="Ex. Hage 1">

<label>Antal utfodringar</label>

<div class="count">

<button class="minus" onclick="change(this,-1)">
−
</button>

<span class="f-count">
${data.count||0}
</span>

<button class="plus" onclick="change(this,1)">
+
</button>

</div>

<div class="card-actions">

<button class="removebtn" onclick="removeCard(this)">
Ta bort
</button>

<button class="savebtn" onclick="saveToHistory(this)">
Spara
</button>

</div>

`;

document.getElementById("list").appendChild(card);

save();
updateStats();

}

function change(btn,amount){

const count=
btn.parentElement.querySelector(".f-count");

count.textContent=
Math.max(
0,
parseInt(count.textContent)+amount
);

save();
updateStats();

}

function removeCard(btn){

btn.closest(".card").remove();

save();
updateStats();

}

function saveToHistory(btn){

const card=btn.closest(".card");

history.unshift({

date:
card.querySelector(".f-date").value,

name:
card.querySelector(".f-name").value || "Namnlös hage",

count:
parseInt(
card.querySelector(".f-count").textContent
)

});

card.querySelector(".f-count").textContent="0";

save();
renderHistory();

}

function deleteHistory(index){

history.splice(index,1);

save();
renderHistory();

}

function renderHistory(){

const box=
document.getElementById("history");

box.innerHTML="";

if(!history.length){

box.innerHTML=
'<div class="empty">Ingen historik ännu</div>';

updateStats();

return;

}

history.forEach((item,index)=>{

const row=document.createElement("div");

row.className="hrow";

row.innerHTML=`

<div>

<div class="hname">
${item.name}
</div>

<div class="hdate">
${item.date}
</div>

</div>

<div style="display:flex;gap:15px;align-items:center;">

<div class="hcount">
${item.count}
</div>

<button
class="hdel"
onclick="deleteHistory(${index})">
✕
</button>

</div>

`;

box.appendChild(row);

});

updateStats();

}

function updateStats(){

document.getElementById("hageCount")
.textContent=
document.querySelectorAll(".card").length;

document.getElementById("historyCount")
.textContent=
history.length;

document.getElementById("totalCount")
.textContent=
history.reduce(
(sum,item)=>sum+item.count,
0
);

}

function save(){

const cards=[
...document.querySelectorAll(".card")
].map(card=>({

date:
card.querySelector(".f-date").value,

name:
card.querySelector(".f-name").value,

count:
parseInt(
card.querySelector(".f-count").textContent
)

}));

localStorage.setItem(
KEY,
JSON.stringify(cards)
);

localStorage.setItem(
HKEY,
JSON.stringify(history)
);

}

function exportBackup(){

const data={

cards:
JSON.parse(
localStorage.getItem(KEY)||"[]"
),

history

};

const blob=new Blob(
[JSON.stringify(data,null,2)],
{type:"application/json"}
);

const a=document.createElement("a");

a.href=URL.createObjectURL(blob);

a.download="ringstad-backup.json";

a.click();

}

function importBackup(){

document
.getElementById("restoreFile")
.click();

}

document
.getElementById("restoreFile")
.addEventListener("change",e=>{

const file=e.target.files[0];

if(!file) return;

const reader=new FileReader();

reader.onload=()=>{

const data=
JSON.parse(reader.result);

localStorage.setItem(
KEY,
JSON.stringify(data.cards||[])
);

localStorage.setItem(
HKEY,
JSON.stringify(data.history||[])
);

location.reload();

};

reader.readAsText(file);

});

(function(){

let cards=[];

try{

cards=
JSON.parse(
localStorage.getItem(KEY)
)||[];

}catch(e){}

try{

history=
JSON.parse(
localStorage.getItem(HKEY)
)||[];

}catch(e){}

if(cards.length){

cards.forEach(addCard);

}else{

addCard({
name:"Hage 1"
});

}

renderHistory();

})();

</script>

</body>
</html>
