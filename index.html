<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#050816">
<title>Ringstad Stallarna V2</title>

<style>

:root{
--bg:#050816;
--glass:rgba(255,255,255,.07);
--glass-b:rgba(255,255,255,.14);
--text:#f4f6ff;
--muted:rgba(244,246,255,.62);
--c1:#7c5cff;
--c2:#22d3ee;
--c3:#34d399;
--c4:#fbbf24;
--red:#fb4b6a;
}

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif;
-webkit-tap-highlight-color:transparent;
}

html{background:var(--bg);}

html{
-webkit-text-size-adjust:100%;
text-size-adjust:100%;
}

body{
min-height:100vh;
min-height:100dvh;
color:var(--text);
padding:calc(18px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) calc(120px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left));
position:relative;
overflow-x:hidden;
background:var(--bg);
max-width:1100px;
margin:0 auto;
touch-action:manipulation;
}

/* ===== Aurora bakgrund ===== */
.aurora{
position:fixed;
inset:0;
z-index:-1;
overflow:hidden;
}
.aurora i{
position:absolute;
border-radius:50%;
filter:blur(80px);
opacity:.55;
animation:float 18s ease-in-out infinite;
}
.aurora i:nth-child(1){width:360px;height:360px;background:var(--c1);top:-100px;left:-80px;}
.aurora i:nth-child(2){width:320px;height:320px;background:var(--c2);top:30%;right:-120px;animation-delay:-6s;}
.aurora i:nth-child(3){width:340px;height:340px;background:#ff4fa3;bottom:-120px;left:10%;animation-delay:-12s;opacity:.35;}

@keyframes float{
0%,100%{transform:translate(0,0) scale(1);}
33%{transform:translate(40px,-30px) scale(1.15);}
66%{transform:translate(-30px,40px) scale(.9);}
}

/* ===== Header ===== */
header{
text-align:center;
margin:10px 0 26px;
}

.badge{
display:inline-block;
font-size:11px;
font-weight:800;
letter-spacing:2px;
padding:6px 14px;
border-radius:999px;
background:linear-gradient(135deg,var(--c1),var(--c2));
box-shadow:0 0 25px rgba(124,92,255,.6);
margin-bottom:14px;
animation:pulse 2.5s ease-in-out infinite;
}

@keyframes pulse{
0%,100%{box-shadow:0 0 18px rgba(124,92,255,.5);}
50%{box-shadow:0 0 38px rgba(34,211,238,.8);}
}

.horse{
font-size:58px;
display:block;
filter:drop-shadow(0 8px 24px rgba(124,92,255,.7));
animation:bob 3.5s ease-in-out infinite;
}

@keyframes bob{
0%,100%{transform:translateY(0) rotate(-3deg);}
50%{transform:translateY(-8px) rotate(3deg);}
}

header h1{
font-size:34px;
font-weight:900;
letter-spacing:-1px;
margin-top:6px;
background:linear-gradient(120deg,#fff 20%,var(--c2) 60%,var(--c1));
-webkit-background-clip:text;
background-clip:text;
color:transparent;
}

header p{
color:var(--muted);
margin-top:4px;
font-size:14px;
letter-spacing:3px;
text-transform:uppercase;
}

/* ===== Stats ===== */
.stats{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:10px;
margin-bottom:18px;
}

.stat{
position:relative;
background:var(--glass);
backdrop-filter:blur(20px);
-webkit-backdrop-filter:blur(20px);
border:1px solid var(--glass-b);
border-radius:22px;
padding:16px 8px 14px;
text-align:center;
overflow:hidden;
}

.stat::before{
content:"";
position:absolute;
inset:0;
background:radial-gradient(circle at 50% -20%,var(--accent),transparent 65%);
opacity:.35;
}

.stat:nth-child(1){--accent:var(--c1);}
.stat:nth-child(2){--accent:var(--c3);}
.stat:nth-child(3){--accent:var(--c4);}

.stat .ico{font-size:20px;position:relative;}

.stat strong{
display:block;
font-size:32px;
font-weight:900;
position:relative;
margin-top:2px;
}

.stat span{
font-size:11px;
color:var(--muted);
text-transform:uppercase;
letter-spacing:1.5px;
position:relative;
}

/* ===== Backup-knappar ===== */
.actions-top{
display:flex;
gap:10px;
margin-bottom:24px;
}

.actions-top button{
flex:1;
padding:13px;
border-radius:16px;
font-size:14px;
font-weight:700;
cursor:pointer;
color:var(--text);
background:var(--glass);
border:1px solid var(--glass-b);
backdrop-filter:blur(20px);
-webkit-backdrop-filter:blur(20px);
transition:.2s;
}
.actions-top button:active{transform:scale(.96);background:var(--glass-b);}

/* ===== Sektionsrubriker ===== */
h2{
display:flex;
align-items:center;
gap:10px;
font-size:13px;
font-weight:800;
letter-spacing:3px;
text-transform:uppercase;
color:var(--muted);
margin:30px 4px 14px;
}
h2::after{
content:"";
flex:1;
height:1px;
background:linear-gradient(90deg,var(--glass-b),transparent);
}

/* ===== Hagkort ===== */
#list{
display:flex;
flex-direction:column;
gap:18px;
}

.card{
position:relative;
border-radius:28px;
padding:20px;
background:linear-gradient(160deg,rgba(255,255,255,.11),rgba(255,255,255,.04));
backdrop-filter:blur(24px);
-webkit-backdrop-filter:blur(24px);
border:1px solid var(--glass-b);
box-shadow:0 20px 50px rgba(0,0,0,.35);
animation:pop .45s cubic-bezier(.2,1.3,.4,1);
}

.card::before{
content:"";
position:absolute;
inset:-1px;
border-radius:28px;
padding:1px;
background:linear-gradient(135deg,var(--c1),transparent 40%,transparent 60%,var(--c2));
-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
-webkit-mask-composite:xor;
mask-composite:exclude;
opacity:.7;
pointer-events:none;
}

@keyframes pop{
from{opacity:0;transform:translateY(20px) scale(.95);}
to{opacity:1;transform:none;}
}

.row2{
display:grid;
grid-template-columns:1fr;
gap:14px;
}

label{
display:block;
margin-bottom:6px;
font-size:11px;
font-weight:700;
letter-spacing:1.5px;
text-transform:uppercase;
color:var(--muted);
}

input{
width:100%;
padding:13px 14px;
border:1px solid var(--glass-b);
border-radius:14px;
background:rgba(0,0,0,.28);
color:var(--text);
font-size:16px;
outline:none;
transition:.2s;
color-scheme:dark;
}
input:focus{
border-color:var(--c2);
box-shadow:0 0 0 3px rgba(34,211,238,.2);
}

/* ===== Räknare ===== */
.count{
display:flex;
align-items:center;
justify-content:space-between;
margin:18px 0 6px;
}

.count button{
width:72px;
height:72px;
border:none;
border-radius:50%;
font-size:34px;
font-weight:800;
cursor:pointer;
color:white;
transition:transform .15s;
}
.count button:active{transform:scale(.88);}

.minus{
background:linear-gradient(145deg,#ff6b81,#e11d48);
box-shadow:0 10px 28px rgba(251,75,106,.45),inset 0 2px 0 rgba(255,255,255,.35);
}

.plus{
background:linear-gradient(145deg,#4ade80,#059669);
box-shadow:0 10px 28px rgba(52,211,153,.5),inset 0 2px 0 rgba(255,255,255,.35);
}

.f-count{
font-size:64px;
font-weight:900;
line-height:1;
min-width:90px;
text-align:center;
background:linear-gradient(180deg,#fff,var(--c2));
-webkit-background-clip:text;
background-clip:text;
color:transparent;
}
.f-count.bump{animation:bump .3s;}

@keyframes bump{
50%{transform:scale(1.3);}
}

.card-actions{
display:flex;
gap:10px;
margin-top:20px;
}

.card-actions button{
padding:14px;
border:none;
border-radius:16px;
cursor:pointer;
font-weight:800;
font-size:15px;
color:white;
transition:transform .15s;
}
.card-actions button:active{transform:scale(.96);}

.removebtn{
flex:0 0 38%;
background:rgba(255,255,255,.09);
border:1px solid var(--glass-b);
}

.savebtn{
flex:1;
background:linear-gradient(135deg,var(--c1),var(--c2));
box-shadow:0 10px 28px rgba(124,92,255,.45);
}

/* ===== Historik / tidslinje ===== */
.dayhead{
display:flex;
justify-content:space-between;
align-items:center;
margin:20px 4px 10px;
}
.dayhead b{font-size:15px;}
.dayhead small{
font-size:12px;
font-weight:700;
padding:4px 11px;
border-radius:999px;
color:var(--c3);
background:rgba(52,211,153,.12);
border:1px solid rgba(52,211,153,.3);
}

.hrow{
position:relative;
display:flex;
justify-content:space-between;
align-items:center;
padding:14px 14px 14px 18px;
border-radius:18px;
margin-bottom:9px;
background:var(--glass);
backdrop-filter:blur(18px);
-webkit-backdrop-filter:blur(18px);
border:1px solid var(--glass-b);
overflow:hidden;
animation:pop .35s ease-out;
}
.hrow::before{
content:"";
position:absolute;
left:0;top:0;bottom:0;
width:4px;
background:linear-gradient(var(--c1),var(--c2));
}

.hname{font-weight:700;font-size:16px;}
.hdate{font-size:12px;color:var(--muted);margin-top:2px;}

.hright{display:flex;gap:12px;align-items:center;}

.hcount{
min-width:44px;
height:44px;
padding:0 10px;
display:grid;
place-items:center;
border-radius:14px;
font-size:22px;
font-weight:900;
color:#06281c;
background:linear-gradient(135deg,#6ee7b7,#34d399);
box-shadow:0 6px 18px rgba(52,211,153,.35);
}

.hdel{
width:34px;
height:34px;
border-radius:50%;
border:none;
background:rgba(251,75,106,.14);
color:var(--red);
font-size:16px;
cursor:pointer;
}
.hdel:active{transform:scale(.88);}

.empty{
color:var(--muted);
text-align:center;
padding:26px;
border:1px dashed var(--glass-b);
border-radius:18px;
}

/* ===== Lägg till ===== */
.add{
position:fixed;
bottom:calc(18px + env(safe-area-inset-bottom));
left:0;
right:0;
margin:0 auto;
width:calc(100% - 32px);
max-width:460px;
height:62px;
border:none;
border-radius:22px;
font-size:18px;
font-weight:900;
letter-spacing:.5px;
color:white;
cursor:pointer;
background:linear-gradient(120deg,var(--c1),#ff4fa3,var(--c2));
background-size:200% 100%;
animation:shine 5s linear infinite;
box-shadow:0 14px 40px rgba(124,92,255,.55);
z-index:20;
}
.add:active{transform:scale(.97);}

@keyframes shine{
to{background-position:200% 0;}
}

/* ===== Toast ===== */
.toast{
position:fixed;
top:18px;
left:50%;
transform:translate(-50%,-120px);
padding:12px 22px;
border-radius:999px;
font-weight:700;
font-size:14px;
background:rgba(16,185,129,.92);
box-shadow:0 12px 30px rgba(0,0,0,.4);
transition:transform .4s cubic-bezier(.2,1.3,.4,1);
z-index:50;
}
.toast.show{transform:translate(-50%,0);}

/* ===== Små mobiler ===== */
@media (max-width:380px){
header h1{font-size:28px;}
.horse{font-size:48px;}
.stat strong{font-size:26px;}
.count button{width:62px;height:62px;font-size:30px;}
.f-count{font-size:54px;min-width:72px;}
.card{padding:16px;border-radius:24px;}
.row2{grid-template-columns:1fr;}
}

/* ===== Mus/pekare: hover endast på enheter som stödjer det ===== */
@media (hover:hover){
.actions-top button:hover{background:var(--glass-b);transform:translateY(-2px);}
.count button:hover{transform:scale(1.08);}
.card-actions button:hover{transform:translateY(-2px);filter:brightness(1.1);}
.hrow:hover{transform:translateX(4px);background:rgba(255,255,255,.1);}
.hrow{transition:.2s;}
.hdel:hover{background:rgba(251,75,106,.3);}
.add:hover{transform:translateY(-3px);}
button{cursor:pointer;}
}

/* ===== Surfplatta ===== */
@media (min-width:700px){
body{padding-left:32px;padding-right:32px;}
header{margin:24px 0 34px;}
header h1{font-size:48px;}
.horse{font-size:76px;}
.stats{gap:16px;margin-bottom:24px;}
.stat{padding:24px 12px 20px;border-radius:26px;}
.stat strong{font-size:44px;}
.stat .ico{font-size:26px;}
.actions-top{max-width:520px;margin-left:auto;margin-right:auto;}
#list{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:22px;
align-items:start;
}
#history{
max-width:820px;
margin:0 auto;
}
h2{margin-top:40px;}
}

/* ===== Dator ===== */
@media (min-width:1050px){
body{padding-left:40px;padding-right:40px;}
#list{grid-template-columns:repeat(3,1fr);}
.f-count{font-size:72px;}
.hrow{padding:16px 18px 16px 22px;}
.add{max-width:380px;}
}

/* ===== Minska rörelse om användaren vill det ===== */
@media (prefers-reduced-motion:reduce){
*{animation:none !important;transition:none !important;}
}

</style>
</head>

<body>

<div class="aurora"><i></i><i></i><i></i></div>
<div class="toast" id="toast">✓ Sparat i historiken</div>

<header>
<span class="horse">🐴</span>
<h1>Ringstad Stallarna</h1>
<p>Utfodringshantering</p>
</header>

<div class="stats">

<div class="stat">
<div class="ico">🌾</div>
<strong id="hageCount">0</strong>
<span>Hagar</span>
</div>

<div class="stat">
<div class="ico">⭐</div>
<strong id="totalCount">0</strong>
<span>Totalt</span>
</div>

<div class="stat">
<div class="ico">📜</div>
<strong id="historyCount">0</strong>
<span>Historik</span>
</div>

</div>

<div class="actions-top">

<button onclick="exportBackup()">📥 Backup</button>
<button onclick="importBackup()">📤 Återställ</button>

</div>

<input type="file" id="restoreFile" hidden>

<h2>Aktiva hagar</h2>

<div id="list"></div>

<h2>Historik</h2>

<div id="history"></div>

<button class="add" onclick="addCard()">＋ Lägg till hage</button>

<script>

const KEY="stall_hagar";
const HKEY="stall_historik";

let history=[];

function today(){
return new Date().toISOString().split("T")[0];
}

function firstDate(){
const f=document.querySelector(".card .f-date");
return f?f.value:"";
}

// Ändrar du datum i första hagen följer alla andra hagar med
function syncDate(input){

const first=document.querySelector(".card .f-date");

if(input===first){

document.querySelectorAll(".card .f-date").forEach(el=>{
el.value=first.value;
});

}

save();

}

function esc(s){
return String(s==null?"":s)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;");
}

function toast(){
const t=document.getElementById("toast");
t.classList.add("show");
clearTimeout(toast._t);
toast._t=setTimeout(()=>t.classList.remove("show"),1800);
}

function addCard(data={}){

const card=document.createElement("div");

card.className="card";

card.innerHTML=`

<div class="row2">

<div>
<label>Datum</label>
<input type="date" class="f-date" value="${esc(data.date||firstDate()||today())}" oninput="syncDate(this)">
</div>

<div>
<label>Hage</label>
<input type="text" class="f-name" value="${esc(data.name||"")}" placeholder="Ex. Hage 1" oninput="save()">
</div>

</div>

<label style="margin-top:16px">Antal utfodringar</label>

<div class="count">

<button class="minus" onclick="change(this,-1)">−</button>

<span class="f-count">${data.count||0}</span>

<button class="plus" onclick="change(this,1)">＋</button>

</div>

<div class="card-actions">

<button class="removebtn" onclick="removeCard(this)">Ta bort</button>

<button class="savebtn" onclick="saveToHistory(this)">Spara</button>

</div>

`;

document.getElementById("list").appendChild(card);

save();
updateStats();

}

function change(btn,amount){

const count=
btn.parentElement.querySelector(".f-count");

count.textContent=
Math.max(
0,
parseInt(count.textContent)+amount
);

count.classList.remove("bump");
void count.offsetWidth;
count.classList.add("bump");

if(navigator.vibrate) navigator.vibrate(12);

save();
updateStats();

}

function removeCard(btn){

btn.closest(".card").remove();

save();
updateStats();

}

function saveToHistory(btn){

const card=btn.closest(".card");

history.unshift({

date:
card.querySelector(".f-date").value,

name:
card.querySelector(".f-name").value || "Namnlös hage",

count:
parseInt(
card.querySelector(".f-count").textContent
)

});

card.querySelector(".f-count").textContent="0";

save();
renderHistory();
toast();

}

function deleteHistory(index){

history.splice(index,1);

save();
renderHistory();

}

function niceDate(d){

if(!d) return "Okänt datum";

const dt=new Date(d+"T12:00:00");

if(isNaN(dt)) return d;

const s=dt.toLocaleDateString("sv-SE",{
weekday:"long",
day:"numeric",
month:"long",
year:"numeric"
});

return s.charAt(0).toUpperCase()+s.slice(1);

}

function renderHistory(){

const box=
document.getElementById("history");

box.innerHTML="";

if(!history.length){

box.innerHTML=
'<div class="empty">Ingen historik ännu</div>';

updateStats();

return;

}

// Högst datum överst, lägst datum längst ner.
// Samma datum: senast sparade överst.
const sorted=history
.map((item,index)=>({item,index}))
.sort((a,b)=>{

const da=a.item.date||"";
const db=b.item.date||"";

if(da!==db) return db.localeCompare(da);

return a.index-b.index;

});

let lastDate=null;

sorted.forEach(({item,index})=>{

if(item.date!==lastDate){

lastDate=item.date;

const dayTotal=history
.filter(h=>h.date===item.date)
.reduce((s,h)=>s+h.count,0);

const head=document.createElement("div");

head.className="dayhead";

head.innerHTML=
`<b>${esc(niceDate(item.date))}</b><small>${dayTotal} totalt</small>`;

box.appendChild(head);

}

const row=document.createElement("div");

row.className="hrow";

row.innerHTML=`

<div>

<div class="hname">${esc(item.name)}</div>

<div class="hdate">${esc(item.date)}</div>

</div>

<div class="hright">

<div class="hcount">${item.count}</div>

<button class="hdel" onclick="deleteHistory(${index})">✕</button>

</div>

`;

box.appendChild(row);

});

updateStats();

}

function updateStats(){

document.getElementById("hageCount")
.textContent=
document.querySelectorAll(".card").length;

document.getElementById("historyCount")
.textContent=
history.length;

document.getElementById("totalCount")
.textContent=
history.reduce(
(sum,item)=>sum+item.count,
0
);

}

function save(){

const cards=[
...document.querySelectorAll(".card")
].map(card=>({

date:
card.querySelector(".f-date").value,

name:
card.querySelector(".f-name").value,

count:
parseInt(
card.querySelector(".f-count").textContent
)

}));

localStorage.setItem(
KEY,
JSON.stringify(cards)
);

localStorage.setItem(
HKEY,
JSON.stringify(history)
);

}

function exportBackup(){

const data={

cards:
JSON.parse(
localStorage.getItem(KEY)||"[]"
),

history

};

const blob=new Blob(
[JSON.stringify(data,null,2)],
{type:"application/json"}
);

const a=document.createElement("a");

a.href=URL.createObjectURL(blob);

a.download="ringstad-backup.json";

a.click();

}

function importBackup(){

document
.getElementById("restoreFile")
.click();

}

document
.getElementById("restoreFile")
.addEventListener("change",e=>{

const file=e.target.files[0];

if(!file) return;

const reader=new FileReader();

reader.onload=()=>{

const data=
JSON.parse(reader.result);

localStorage.setItem(
KEY,
JSON.stringify(data.cards||[])
);

localStorage.setItem(
HKEY,
JSON.stringify(data.history||[])
);

location.reload();

};

reader.readAsText(file);

});

(function(){

let cards=[];

try{

cards=
JSON.parse(
localStorage.getItem(KEY)
)||[];

}catch(e){}

try{

history=
JSON.parse(
localStorage.getItem(HKEY)
)||[];

}catch(e){}

if(cards.length){

cards.forEach(addCard);

}else{

addCard({
name:"Hage 1"
});

}

renderHistory();

})();

</script>

</body>
</html>
